<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多平台訂單匯整與出貨列印系統</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Tab 導覽列 -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="import">訂單匯入</button>
    <button class="tab-btn" data-tab="print">出貨列印</button>
    <button class="tab-btn" data-tab="dashboard">銷售儀表板</button>
  </nav>

  <!-- Tab 1：訂單匯入 -->
  <section id="tab-import" class="tab-content active">
    <h2>訂單匯入</h2>

    <!-- 檔案上傳區 -->
    <div class="upload-area" id="upload-area">
      <p>將 CSV 檔案拖曳至此，或點擊選取檔案</p>
      <input type="file" id="file-input" accept=".csv">
    </div>
    <div id="upload-error" class="error-msg" hidden></div>

    <!-- 載入範例按鈕 -->
    <div class="example-btns">
      <button id="btn-pinkoi">載入 Pinkoi 範例</button>
      <button id="btn-cyberbiz">載入 CYBERBIZ 範例</button>
    </div>

    <!-- 原始預覽 -->
    <h3>原始資料預覽</h3>
    <div class="table-wrapper">
      <table id="preview-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 清洗結果 -->
    <h3>清洗結果</h3>
    <div class="filter-row">
      <label for="platform-filter">篩選平台：</label>
      <select id="platform-filter">
        <option value="all">全部</option>
        <option value="Pinkoi">Pinkoi</option>
        <option value="CYBERBIZ">CYBERBIZ</option>
      </select>
    </div>
    <div class="table-wrapper">
      <table id="cleaned-table">
        <thead>
          <tr>
            <th>訂單編號</th>
            <th>平台來源</th>
            <th>日期</th>
            <th>收件人</th>
            <th>電話</th>
            <th>地址</th>
            <th>商品名稱</th>
            <th>數量</th>
            <th>物流方式</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- Tab 2：出貨列印 -->
  <section id="tab-print" class="tab-content">
    <h2>出貨列印</h2>

    <div class="action-btns">
      <button id="btn-shipping">產生出貨單</button>
      <button id="btn-picking">產生揀貨單</button>
      <button id="btn-print">列印</button>
    </div>

    <div id="print-area" class="print-area"></div>
  </section>

  <!-- Tab 3：銷售儀表板 -->
  <section id="tab-dashboard" class="tab-content">
    <h2>銷售儀表板</h2>

    <!-- 篩選列：時間範圍 + 平台 -->
    <div class="dashboard-filters">
      <div class="filter-group">
        <label for="range-filter">資料期間</label>
        <select id="range-filter">
          <option value="all">全部</option>
          <option value="7d">過去 7 天</option>
          <option value="30d">過去 30 天</option>
          <option value="day">按日</option>
          <option value="month">按月</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="dash-platform-filter">平台</label>
        <select id="dash-platform-filter">
          <option value="all">全部</option>
          <option value="Pinkoi">Pinkoi</option>
          <option value="CYBERBIZ">CYBERBIZ</option>
        </select>
      </div>
    </div>

    <!-- 摘要卡片 -->
    <div class="summary-cards">
      <div class="card">
        <span class="card-label">總訂單數</span>
        <span class="card-value" id="total-orders">0</span>
      </div>
      <div class="card">
        <span class="card-label">總營收</span>
        <span class="card-value" id="total-revenue">$0</span>
      </div>
      <div class="card">
        <span class="card-label">平均客單價</span>
        <span class="card-value" id="avg-price">$0</span>
      </div>
    </div>

    <!-- 近 7 日訂單趨勢 -->
    <h3>近 7 日訂單趨勢</h3>
    <div id="trend-chart" class="trend-chart">
      <svg id="trend-svg" width="100%" height="200" role="img" aria-label="近 7 日訂單趨勢長條圖"></svg>
    </div>

    <!-- 熱銷 TOP 5 -->
    <h3>熱銷商品 TOP 5</h3>
    <div class="table-wrapper">
      <table id="top5-table">
        <thead>
          <tr>
            <th>排名</th>
            <th>商品名稱</th>
            <th>銷售數量</th>
            <th>銷售金額</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 營收比較（依所選時間範圍動態呈現） -->
    <h3 id="revenue-chart-title">營收比較</h3>
    <div id="revenue-chart" class="trend-chart">
      <svg id="revenue-svg" width="100%" height="220" role="img" aria-label="營收比較長條圖"></svg>
    </div>

    <!-- 產品別營收比較 -->
    <h3>產品別營收比較</h3>
    <div id="product-revenue-chart" class="bar-chart"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
