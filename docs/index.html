<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多平台訂單匯整與出貨列印系統</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Tab 導覽列 -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="import">訂單匯入</button>
    <button class="tab-btn" data-tab="print">出貨列印</button>
    <button class="tab-btn" data-tab="dashboard">銷售儀表板</button>
  </nav>

  <!-- Tab 1：訂單匯入 -->
  <section id="tab-import" class="tab-content active">
    <!-- 標題列：標題 + 上傳按鈕 -->
    <div class="section-header">
      <h2>訂單匯入</h2>
      <button id="btn-upload" class="primary-btn">上傳訂單檔案 CSV / Excel（可多選）</button>
    </div>

    <!-- 檔案上傳區（拖曳） -->
    <div class="upload-area" id="upload-area">
      <p>將一個或多個 CSV / Excel（.xlsx）檔案拖曳至此，或點擊選取檔案</p>
      <input type="file" id="file-input" accept=".csv,.xlsx" multiple>
    </div>
    <div id="upload-error" class="error-msg" hidden></div>

    <!-- 操作按鈕 -->
    <div class="example-btns">
      <button id="btn-example">載入範例資料（Pinkoi + CYBERBIZ）</button>
      <button id="btn-clear">清除資料</button>
      <button id="btn-export">匯出清洗結果（CSV）</button>
    </div>

    <!-- 原始預覽 -->
    <h3>原始資料預覽</h3>
    <div id="import-status" class="import-status" hidden></div>
    <div class="table-wrapper">
      <table id="preview-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 清洗結果 -->
    <h3>清洗結果</h3>
    <div class="filter-row">
      <label for="platform-filter">篩選平台：</label>
      <select id="platform-filter">
        <option value="all">全部</option>
        <option value="Pinkoi">Pinkoi</option>
        <option value="CYBERBIZ">CYBERBIZ</option>
      </select>
    </div>
    <div class="table-wrapper">
      <table id="cleaned-table">
        <thead>
          <tr>
            <th>訂單編號</th>
            <th>平台來源</th>
            <th>日期</th>
            <th>收件人</th>
            <th>電話</th>
            <th>地址</th>
            <th>商品明細</th>
            <th>總數量</th>
            <th>物流方式</th>
            <th>訂單金額</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- Tab 2：出貨列印 -->
  <section id="tab-print" class="tab-content">
    <h2>出貨列印</h2>
    <p class="print-hint">選擇單據類型後點「產生」，同一區域只會顯示所選單據，確認無誤即可列印。出貨單為每筆訂單一張的寄件明細；揀貨單為依商品彙總的備貨清單。</p>

    <!-- 操作列（固定於頂部） -->
    <div class="doc-toolbar">
      <div class="filter-group">
        <label for="doc-type">單據類型</label>
        <select id="doc-type">
          <option value="shipping">出貨單</option>
          <option value="picking">揀貨單</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="doc-platform">平台</label>
        <select id="doc-platform">
          <option value="all">全部</option>
          <option value="Pinkoi">Pinkoi</option>
          <option value="CYBERBIZ">CYBERBIZ</option>
        </select>
      </div>
      <button id="btn-generate" class="doc-btn doc-btn-shipping">產生</button>
      <button id="btn-print-doc" class="doc-btn doc-btn-outline" disabled>列印</button>
    </div>

    <!-- 共用顯示區 -->
    <div id="doc-area" class="print-area">
      <p class="doc-empty">請選擇單據類型並點「產生」。</p>
    </div>
  </section>

  <!-- Tab 3：銷售儀表板 -->
  <section id="tab-dashboard" class="tab-content">
    <div class="section-header">
      <h2>銷售儀表板</h2>
      <button id="btn-sync" class="primary-btn">與訂單同步</button>
    </div>
    <div id="sync-status" class="sync-status">尚未同步</div>

    <!-- 篩選列：時間範圍 + 平台 -->
    <div class="dashboard-filters">
      <div class="filter-group">
        <label for="range-filter">資料期間</label>
        <select id="range-filter">
          <option value="all">全部</option>
          <option value="7d">過去 7 天</option>
          <option value="30d">過去 30 天</option>
          <option value="day">按日</option>
          <option value="month">按月</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="dash-platform-filter">平台</label>
        <select id="dash-platform-filter">
          <option value="all">全部</option>
          <option value="Pinkoi">Pinkoi</option>
          <option value="CYBERBIZ">CYBERBIZ</option>
        </select>
      </div>
    </div>

    <!-- 摘要卡片 -->
    <div class="summary-cards">
      <div class="card">
        <span class="card-label">總訂單數</span>
        <span class="card-value" id="total-orders">0</span>
      </div>
      <div class="card">
        <span class="card-label">總營收</span>
        <span class="card-value" id="total-revenue">$0</span>
      </div>
      <div class="card">
        <span class="card-label">平均客單價</span>
        <span class="card-value" id="avg-price">$0</span>
      </div>
    </div>

    <!-- 營收與訂單合併圖（依所選時間範圍動態呈現） -->
    <h3 id="revenue-chart-title">營收與訂單趨勢</h3>
    <div class="chart-legend">
      <span class="legend-item"><span class="legend-bar"></span>營收（長條）</span>
      <span class="legend-item"><span class="legend-line"></span>訂單數（折線）</span>
    </div>
    <div id="revenue-chart" class="trend-chart">
      <svg id="revenue-svg" width="100%" height="240" role="img" aria-label="營收與訂單趨勢合併圖"></svg>
    </div>

    <!-- 熱銷 TOP 5 -->
    <h3>熱銷商品 TOP 5</h3>
    <div class="table-wrapper">
      <table id="top5-table">
        <thead>
          <tr>
            <th>排名</th>
            <th>商品名稱</th>
            <th>銷售數量</th>
            <th>出現訂單數</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 產品別營收比較 -->
    <h3>產品別營收比較</h3>
    <div id="product-revenue-chart" class="bar-chart"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
